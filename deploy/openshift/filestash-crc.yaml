# Filestash CRC deployment — fork_feature branch
# Image: filestash:fork-feature-latest
# Internal registry ref: image-registry.openshift-image-registry.svc:5000/filestash/filestash:fork-feature-latest
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filestash-data
  namespace: filestash
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filestash-testfiles
  namespace: filestash
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
# Seed Job — runs once at deploy time, populates filestash-testfiles PVC
# with representative files for CVE feature testing.
# Retained formats: JPEG (libjpeg-turbo), PNG (libpng), ZIP (Go native)
# Removed formats (expect graceful failure): GIF (giflib), HEIC (libheif), RAR, TAR
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-testfiles
  namespace: filestash
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
      containers:
        - name: seeder
          image: alpine:3.19
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache zip

              BASE=/mnt/testfiles
              mkdir -p "$BASE/documents" "$BASE/images" "$BASE/archives"

              # --- documents ---
              echo "Filestash CVE test environment" > "$BASE/documents/readme.txt"
              printf '# Notes\n\nTest file for markdown rendering.\n' > "$BASE/documents/notes.md"
              printf '%%PDF-1.4\n1 0 obj\n<</Type /Catalog>>\nendobj\nxref\n0 1\n0000000000 65535 f \ntrailer\n<</Size 1/Root 1 0 R>>\nstartxref\n9\n%%%%EOF\n' > "$BASE/documents/fake.pdf"

              # --- images (base64-encoded minimal valid files) ---
              # Minimal 1x1 JPEG (libjpeg-turbo — should work)
              echo '/9j/4AAQSkZJRgABAQEAAAAAAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoH
              BwYIDAoMCwsKCwsNCxAQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQME
              BAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU
              FBQUFBQUFBT/wAARCAABAAEDASIAAhEBAxEB/8QAFgABAQEAAAAAAAAAAAAAAAAA
              CAUG/8QAHhAAAQQDAQEBAAAAAAAAAAAAAQIDBAUREiEx/8QAFAEBAAAAAAAAAAAAAAAA
              AAAAA/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEQMRAD8Amk2pqtaWZS4
              Z3ckwY7KO2RRSBvwNkGlK5x8OAAoAKAD/9k=' | tr -d ' \n' | base64 -d > "$BASE/images/photo.jpg"

              # Minimal 1x1 PNG (libpng — should work)
              echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > "$BASE/images/graphic.png"

              # Minimal valid GIF — giflib removed, thumbnail expected to fail gracefully
              echo 'R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==' | base64 -d > "$BASE/images/animation.gif"

              # HEIC placeholder — libheif removed, expect graceful failure
              touch "$BASE/images/photo.heic"

              # --- archives ---
              # Valid ZIP (Go native zip — should work)
              echo "zip test content" > /tmp/ziptest.txt
              zip "$BASE/archives/archive.zip" /tmp/ziptest.txt

              # Placeholders for removed format support
              touch "$BASE/archives/compressed.rar"
              touch "$BASE/archives/backup.tar"
              touch "$BASE/archives/tarball.tar.gz"

              echo "Seed complete."
              ls -lR "$BASE"
          volumeMounts:
            - name: testfiles
              mountPath: /mnt/testfiles
      volumes:
        - name: testfiles
          persistentVolumeClaim:
            claimName: filestash-testfiles
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filestash
  namespace: filestash
  labels:
    app: filestash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filestash
  template:
    metadata:
      labels:
        app: filestash
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: filestash
          image: image-registry.openshift-image-registry.svc:5000/filestash/filestash:fork-feature-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8334
          env:
            - name: DEBUG
              value: "false"
            - name: APPLICATION_URL
              value: "filestash-filestash.apps-crc.testing"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: testfiles
              mountPath: /mnt/testfiles
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8334
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8334
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filestash-data
        - name: testfiles
          persistentVolumeClaim:
            claimName: filestash-testfiles
---
apiVersion: v1
kind: Service
metadata:
  name: filestash
  namespace: filestash
spec:
  selector:
    app: filestash
  ports:
    - port: 8334
      targetPort: 8334
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: filestash
  namespace: filestash
spec:
  host: filestash-filestash.apps-crc.testing
  to:
    kind: Service
    name: filestash
  port:
    targetPort: 8334
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
